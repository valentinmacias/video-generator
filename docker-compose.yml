version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # ── Google credentials ────────────────────────────────────────────────────
      # Option A (recommended for local dev): mount a key file
      #   1. Place your service-account JSON at ./vertex-key.json
      #   2. Uncomment the two lines below and the volume mount under `volumes`
      # - GOOGLE_APPLICATION_CREDENTIALS=/creds/sa.json
      #
      # Option B: inline JSON string (no volume mount needed)
      #   Set GCS_CREDENTIALS_JSON in backend/.env:
      #   GCS_CREDENTIALS_JSON={"type":"service_account","project_id":"..."}
      #
      # Option C: Cloud Run / GKE — attach a service account, no config needed.
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - GCS_CREDENTIALS_JSON=${GCS_CREDENTIALS_JSON:-}
      - GEMINI_VEO_API_KEY=${GEMINI_VEO_API_KEY:-}
    volumes:
      - ./backend:/app
      # Uncomment to mount a local service-account key file (Option A):
      # - ./vertex-key.json:/creds/sa.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
