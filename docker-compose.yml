version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # Explicitly forward Symphony-specific keys so they are visible in the container
      # even if a sub-set .env is used.  Values are sourced from backend/.env.
      - NANO_BANANA_API_KEY=${NANO_BANANA_API_KEY:-}
      - GEMINI_VEO_API_KEY=${GEMINI_VEO_API_KEY:-}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
